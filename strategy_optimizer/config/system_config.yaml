# System-wide settings
data_sources:
  default_exchange: 'phemex'
  leader_asset: 'BTC'  # Leader asset for correlation calculations
  follower_assets:     # Assets to optimize
    - 'ETH'
    - 'SOL'
    - 'AVAX'

paths:
  market_data: 'strategy_optimizer/data/market/'
  artifacts: 'strategy_optimizer/data/artifacts/'
  state_db: 'strategy_optimizer/data/state/optimizer_state.db'
  logs: 'strategy_optimizer/logs/'

thresholds:
  max_drawdown_pct: 20.0
  t1_data_gap_threshold: 0.1 # 10%
  minimum_trade_history_days: 90  # Minimum days of data before optimization

risk:
  max_capital_exposure_pct: 20.0
  max_drawdown_limit_pct: 15.0

api:
  ccxt:
    rate_limit: 2000 # ms
    candle_timeframe: '1h'  # 1-hour candles per spec
    max_retries: 3
    retry_delay_ms: 500
  deepseek:
    timeout: 60 # seconds
    model: 'deepseek-coder'
    temperature: 0.5
    max_tokens: 1000

monitoring:
  dashboard_port: 5000
  health_check_interval: 60 # seconds
  log_level: 'INFO'
  dashboard_enabled: false

optimization:
  min_iterations_before_freeze: 3    # Must run at least N iterations before allowing freeze
  learning_mode_enabled: true         # Track and learn from tested parameters
  credit_assignment_enabled: true     # Enable drawdown attribution analysis (spec 3.2.1)
  audit_all_proposals: true          # Run audit on all proposals before execution
